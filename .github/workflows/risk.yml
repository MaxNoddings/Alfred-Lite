name: alfred-lite-risk

# NOTE: no `schedule:` here on purpose. GitHub's built-in cron proved unreliable,
# so this workflow is fired via workflow_dispatch by an EXTERNAL cron service
# (cron-jobs.org) — every 15 min during market hours. Cadence changes happen THERE,
# not in this file. The sweep makes no model calls (pure arithmetic on the live
# snapshot, ~$0), and main.py gates on Alpaca's clock, so off-hours fires no-op.
on:
  workflow_dispatch: {}            # external cron trigger + manual "Run workflow" button

permissions:
  contents: write                  # to commit state back to the repo

concurrency:
  group: alfred-lite               # shares the full run's group — never trade at once
  cancel-in-progress: false

jobs:
  risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alfred risk sweep
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          BROKER: alpaca
        run: python main.py --risk-only

      - name: Commit state
        run: |
          git config user.name "alfred-lite-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain trades.csv risk_state.json)" ]; then
            git add trades.csv risk_state.json
            git commit -m "Risk sweep [skip ci]"
            # workflow_dispatch pins the checkout SHA at dispatch time, so a run that
            # queued behind another push (the hourly trade run) starts one commit
            # behind main and its push is rejected. Rebase onto main and retry;
            # -X theirs keeps THIS run's state files on conflict (rebase swaps the
            # sides: "theirs" = our commit), which is right because our snapshot is
            # newer — and trades.csv is protected separately by merge=union.
            n=0
            until git push; do
              n=$((n+1)); [ "$n" -ge 3 ] && exit 1
              git pull --rebase -X theirs origin main
            done
          else
            echo "no risk exits — nothing to log"
          fi
