name: alfred-lite-risk

on:
  schedule:
    # Lightweight stop-loss / trailing-stop sweep every 10 min during market hours.
    # No brain, no news — pure arithmetic on the live snapshot, so ~$0 in API cost.
    # main.py gates on Alpaca's clock, so off-hours fires just no-op.
    - cron: "*/10 13-20 * * 1-5"
  workflow_dispatch: {}            # manual "Run workflow" button

permissions:
  contents: write                  # to commit state back to the repo

concurrency:
  group: alfred-lite               # shares the full run's group — never trade at once
  cancel-in-progress: false

jobs:
  risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alfred risk sweep
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          BROKER: alpaca
        run: python main.py --risk-only

      - name: Commit state
        run: |
          git config user.name "alfred-lite-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain trades.csv risk_state.json)" ]; then
            git add trades.csv risk_state.json
            git commit -m "Risk sweep [skip ci]"
            git push
          else
            echo "no risk exits — nothing to log"
          fi
