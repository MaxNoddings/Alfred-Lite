name: alfred-lite

# NOTE: no `schedule:` here on purpose. GitHub's built-in cron proved unreliable,
# so this workflow is fired via workflow_dispatch by an EXTERNAL cron service
# (cron-jobs.org) — hourly during market hours. Cadence changes happen THERE,
# not in this file. main.py still gates on Alpaca's clock, so off-hours fires no-op.
on:
  workflow_dispatch: {}            # external cron trigger + manual "Run workflow" button

permissions:
  contents: write                  # to commit trades.csv back to the repo

concurrency:
  group: alfred-lite               # never let two runs overlap
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alfred
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          BROKER: alpaca
        run: python main.py

      - name: Commit trade log
        run: |
          git config user.name "alfred-lite-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain trades.csv risk_state.json)" ]; then
            git add trades.csv risk_state.json
            git commit -m "Log trades [skip ci]"
            git push
          else
            echo "no new trades to log"
          fi
